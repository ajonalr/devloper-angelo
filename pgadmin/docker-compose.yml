version: '3.7'

services:
  pg_db:
    image: postgres:15.1
    container_name: postgres-global  # Nombre claro para tu red
    restart: always
    volumes:
      - ./database_data:/var/lib/postgresql/data
    ports:
      - 5433:5432 # Cambié el puerto externo a 5433 por si tienes un Postgres nativo en la Dell
    environment:
      POSTGRES_DB: admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: jonas123
    networks:
      - red-global

  pg_admin:
    image: dpage/pgadmin4:6.17
    container_name: pgadmin-global
    depends_on:
      - pg_db
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ariel12jona@gmail.com
      PGADMIN_DEFAULT_PASSWORD: jonas123
      PGADMIN_LISTEN_PORT: 5052
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    ports:
      - 5052:5052
    networks:
      - red-global

networks:
  red-global:
    external: true # Conecta a la red que ya existe

# sudo chown -R 5050:5050 ./pgadmin
# sudo chown -R 5050:5050 ./database_data